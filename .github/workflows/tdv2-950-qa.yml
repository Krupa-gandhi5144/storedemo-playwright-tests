name: TDV2-950 notification QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  verify:
    if: github.head_ref == 'qa/tdv2-950-notifications'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TDV2_943_ENABLED: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact staging reporter
        env:
          TDV2_950_QA_BUNDLE: ${{ secrets.TDV2_950_QA_BUNDLE }}
        run: node .github/qa/prepare-950.cjs
      - name: Install isolated dependencies
        run: npm install --prefix .tdv2-950-ci --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Exercise notifications and capture PR snapshots
        working-directory: .tdv2-950-ci
        run: node ../.github/qa/run-950.cjs --finish
      - name: Preserve notification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdv2-950-notification-evidence
          path: .tdv2-950-ci/output/tdv2-950
          retention-days: 3
      - name: Preserve PR snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdv2-950-pr-snapshots
          path: .tdv2-950-ci/snapshots
          retention-days: 3
